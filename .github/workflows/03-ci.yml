name: CI Contextes

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  APP_NAME: fastapi-starter

jobs:
  context-job:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Afficher les contextes (Q8)
        run: |
          echo "Nom de l'application : ${{ env.APP_NAME }}"
          echo "Acteur : ${{ github.actor }}"
          echo "Nom de l'événement : ${{ github.event_name }}"
          echo "Branche : ${{ github.ref_name }}"
          echo "SHA du commit : ${{ github.sha }}"
          echo "OS du runner : ${{ runner.os }}"

      - name: Afficher le JSON complet du contexte (Q10)
        run: |
          echo '${{ toJson(github) }}'